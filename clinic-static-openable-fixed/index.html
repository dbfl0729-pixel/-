<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>클리닉 상담 가격표</title>
<style>
:root{
  --bg:#0b0d12;
  --panel:#111625;
  --panel2:#0f1320;
  --text:#e8ecf6;
  --muted:#9aa4bf;
  --border:rgba(255,255,255,.10);
  --accent:#6ea8ff;
  --good:#46d38b;
  --bad:#ff6b6b;
  --warn:#ffd166;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font: ui-sans-serif, system-ui, -apple-system, "Apple SD Gothic Neo","Noto Sans KR","Segoe UI",Arial;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 30% -10%, rgba(110,168,255,.25), transparent 60%),
    radial-gradient(1000px 700px at 90% 10%, rgba(70,211,139,.16), transparent 55%),
    var(--bg);
}
a{color:inherit;text-decoration:none}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.sidebar{
  position:sticky;top:0;height:100vh;
  background:linear-gradient(180deg, rgba(17,22,37,.95), rgba(15,19,32,.95));
  border-right:1px solid var(--border);
  padding:18px 14px;
}
.brand{display:flex;align-items:center;gap:10px;padding:10px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.logo{width:36px;height:36px;border-radius:12px;background:rgba(110,168,255,.22);display:grid;place-items:center;border:1px solid rgba(110,168,255,.35);font-weight:900}
.brand .title{font-weight:900;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.nav button{
  width:100%;
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;border-radius:12px;color:var(--muted);
  border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;
}
.nav button.active{color:var(--text);background:rgba(110,168,255,.12);border-color:rgba(110,168,255,.22)}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.06)}
.main{padding:18px 18px 28px}
.topbar{
  display:flex;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 14px;background:rgba(17,22,37,.7);
  border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)
}
.topbar .left,.topbar .right{display:flex;gap:10px;align-items:center}
.input{
  width:360px;max-width:55vw;
  padding:10px 12px;border-radius:12px;border:1px solid var(--border);
  background:rgba(15,19,32,.6);color:var(--text);outline:none
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 12px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:var(--text);cursor:pointer
}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.primary{border-color:rgba(110,168,255,.35);background:rgba(110,168,255,.12)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}
.panel{
  background:rgba(17,22,37,.7);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden
}
.panelHeader{
  padding:12px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.panelHeader h2{margin:0;font-size:16px}
.panelBody{padding:14px}
.muted{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.card{
  border:1px solid rgba(255,255,255,.08);
  background:rgba(15,19,32,.45);
  border-radius:14px;
  padding:12px;
  display:flex;flex-direction:column;gap:8px
}
.cardTitle{font-weight:900}
.cardRow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:900;letter-spacing:.2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  padding:4px 8px;font-size:12px;border-radius:999px;
  border:1px solid rgba(255,255,255,.10);
  color:var(--muted);
  background:rgba(255,255,255,.03)
}
.notice{
  margin-top:10px;padding:10px 12px;border-radius:12px;
  border:1px solid rgba(255,255,255,.10);
  background:rgba(255,255,255,.04);
  display:flex;align-items:center;gap:10px
}
.notice .dot{width:10px;height:10px;border-radius:999px;background:var(--accent)}
.table{width:100%;border-collapse:collapse}
.table th,.table td{border-bottom:1px solid rgba(255,255,255,.06);padding:10px 8px;text-align:left;vertical-align:top}
.table th{color:var(--muted);font-size:12px;font-weight:800}
.table td{font-size:14px}
hr.sep{border:none;border-top:1px solid rgba(255,255,255,.08);margin:12px 0}

.drawerBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);
  background:rgba(17,22,37,.98);
  border-left:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:14px;display:none;flex-direction:column;gap:12px
}
.drawerHeader{display:flex;align-items:center;justify-content:space-between}
.drawerHeader h3{margin:0;font-size:16px}
.drawerFooter{margin-top:auto;display:flex;gap:10px}
.smallBtn{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);cursor:pointer}
.smallBtn:hover{background:rgba(255,255,255,.06)}
.totalBox{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(255,255,255,.03)}

.modalBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px}
.modal{
  width:min(920px,96vw);
  background:rgba(17,22,37,.95);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden
}
.modalHeader{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.modalHeader h3{margin:0;font-size:16px}
.modalBody{padding:14px}
.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{border:1px solid rgba(255,255,255,.10);border-radius:12px;background:rgba(255,255,255,.03);padding:10px 12px}
.kpi .big{font-weight:900;font-size:18px}
kbd{border:1px solid var(--border);border-radius:8px;padding:2px 6px;color:var(--muted);font-size:12px}

.toast{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(17,22,37,.95);box-shadow:var(--shadow);
  display:none;gap:10px;align-items:center
}
.toast .dot{width:10px;height:10px;border-radius:999px;background:var(--good)}

@media (max-width: 980px){
  .layout{grid-template-columns:1fr}
  .sidebar{height:auto;position:relative}
  .grid{grid-template-columns:1fr}
  .input{width:100%;max-width:100%}
  .twoCol{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">D</div>
      <div>
        <div class="title">상담 가격표</div>
        <div class="sub">가격표 · 단품 · 관리자</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button data-view="price" class="active">가격표 (프로그램/이벤트)</button>
      <button data-view="single">단품 레이저</button>
<button data-view="admin">관리자</button>
    </nav>

    <hr class="sep"/>

    <div class="muted" style="line-height:1.45">
      단축키:
      <div><kbd>/</kbd> 검색 포커스</div>
      <div><kbd>c</kbd> 계산기</div>
      <div><kbd>k</kbd> 장바구니</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="left">
        <input id="searchInput" class="input" placeholder="검색: 프로그램/단품/효과/설명" />
      </div>
      <div class="right">
        <button class="btn" id="calcBtn">계산기</button>
        <button class="btn primary" id="cartBtn">장바구니 <span id="cartCount" class="tag">0</span></button>
      </div>
    </header>

    <section class="grid">
      <div class="panel">
        <div class="panelHeader">
          <h2 id="panelTitle">가격표</h2>
          <div class="muted" id="panelSub">프로그램 / 이벤트</div>
        </div>
        <div class="panelBody" id="leftBody"></div>
      </div>

      <div class="panel">
        <div class="panelHeader">
          <h2>Program Details</h2>
          <div class="muted">선택 항목 상세</div>
        </div>
        <div class="panelBody" id="detailBody">
          <div class="muted">왼쪽에서 프로그램을 선택하면 상세가 표시됩니다.</div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Drawer: Cart -->
<div class="drawerBackdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="cartDrawer" aria-hidden="true">
  <div class="drawerHeader">
    <h3>장바구니</h3>
    <button class="smallBtn" id="closeCart">닫기</button>
  </div>
  <div class="muted">상담 견적용. 항목 추가/삭제 가능합니다.</div>
  <div id="cartList"></div>
  <div class="totalBox">
    <div class="muted">합계</div>
    <div class="price"><span id="cartTotal">0</span>원</div>
  </div>
  <div class="drawerFooter">
    <button class="btn" id="clearCart">비우기</button>
    <button class="btn primary" id="copyQuote">견적 복사</button>
  </div>
</aside>

<!-- Modal: Calculator -->
<div class="modalBackdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modalHeader">
      <h3>상담 계산기</h3>
      <button class="smallBtn" id="closeCalc">닫기</button>
    </div>
    <div class="modalBody">
      <div class="twoCol">
        <div class="kpi">
          <div class="muted">현재 장바구니 합계</div>
          <div class="big"><span id="calcCartSum">0</span>원</div>
        </div>
        <div class="kpi">
          <div class="muted">할인/추가 입력</div>
          <input id="adjInput" class="input" style="width:100%;max-width:100%" placeholder="예: -50000 (할인) / 30000 (추가)"/>
          <div style="display:flex;gap:8px;margin-top:10px">
            <input id="adjAmount" class="input" style="flex:1;max-width:100%" placeholder="금액 입력 (부호 없이)"/>
            <button class="btn" id="adjPlusBtn" style="padding:10px 12px">+</button>
            <button class="btn" id="adjMinusBtn" style="padding:10px 12px">-</button>
          </div>
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
            <button class="btn" id="disc10">10% 할인</button>
            <button class="btn" id="disc15">15% 할인</button>
            <button class="btn" id="disc20">20% 할인</button>
          </div>
          <div class="muted" style="margin-top:8px">최종 = 합계 + 입력값</div>
        </div>
      </div>
      <hr class="sep"/>
      <div class="kpi">
        <div class="muted">최종 금액</div>
        <div class="big"><span id="finalAmount">0</span>원</div>
      </div>
      <div class="muted" style="margin-top:10px;line-height:1.5">
        팁: 할인은 음수로 입력 (예: -100000).
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"><div class="dot"></div><div id="toastText">저장됨</div></div>

<script>
/* =========================
   데이터 (여기만 수정하면 됨)
========================= */
const VAT_NOTICE = 'VAT 포함 / 현금·카드 동일가';

const programSections = [
  {
    key: 'lifting',
    title: '리프팅',
    isEvent: false,
    programs: [
      { id:'ulthera-300', name:'울쎄라 300샷', price:990000, effects:['탄력','리프팅','처짐 개선'], details:'울쎄라 300샷 1회. 개인 피부 상태/부위에 따라 샷 수 및 범위가 달라질 수 있습니다.' },
      { id:'shurink', name:'슈링크 유니버스', price:150000, effects:['탄력','리프팅'], details:'가성비 탄력 관리. 부위 및 라인에 따라 시술 범위가 달라질 수 있습니다.' }
    ]
  },
  {
    key: 'toning',
    title: '토닝/색소',
    isEvent: false,
    programs: [
      { id:'pico-toning', name:'피코 토닝', price:220000, effects:['잡티','톤 개선','칙칙함'], details:'색소 상태에 따라 레이저 조합/횟수가 달라질 수 있습니다.' }
    ]
  },
  {
    key: 'event',
    title: '이벤트',
    isEvent: true,
    programs: [
      { id:'event-sample', name:'이벤트 패키지', price:490000, effects:['기간 한정','프로모션'], details:'이벤트 구성은 기간/재고/원장 판단에 따라 변동될 수 있습니다.' }
    ]
  }
];

const singleLaserItems = [
  { id:'rev-lite-1', name:'레블라이트 토닝 1회', price:150000, note:'기본 토닝' },
  { id:'pico-532-1', name:'피코 532 1회', price:190000, note:'표재 색소' },
  { id:'alex-755-1', name:'알렉스 755 1회', price:220000, note:'진한 색소' }
];


/* =========================
   유틸
========================= */
const fmt = (n)=> new Intl.NumberFormat('ko-KR').format(Number(n||0));
const qs = (s,el=document)=> el.querySelector(s);
const qsa = (s,el=document)=> Array.from(el.querySelectorAll(s));
const toast = (msg)=>{
  const t = qs('#toast'); qs('#toastText').textContent = msg;
  t.style.display='flex';
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>{t.style.display='none'}, 1200);
};

/* =========================
   상태
========================= */
let view = 'price';            // price | single | admin
let activeSectionKey = 'lifting';
let selectedItem = null;       // {type:'program'|'single', ...}
let cart = [];                 // {id,name,price,qty}

/* =========================
   렌더
========================= */
function setView(next){
  view = next;
  qsa('#nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===next);
  });
  selectedItem = null;
  renderAll();
}

function renderAll(){
  renderHeader();
  renderLeft();
  renderDetail();
  renderCart();
}

function renderHeader(){
  const title = qs('#panelTitle');
  const sub = qs('#panelSub');
  if(view==='price'){ title.textContent='가격표'; sub.textContent='프로그램 / 이벤트'; }
  if(view==='single'){ title.textContent='단품 레이저'; sub.textContent='1회 단가 빠른 조회'; }
  if(view==='admin'){ title.textContent='관리자'; sub.textContent='더미 페이지(확장 가능)'; }
}

function renderLeft(){
  const left = qs('#leftBody');
  left.innerHTML = '';

  const keyword = qs('#searchInput').value.trim().toLowerCase();

  if(view==='price'){
    // section tabs
    const tabs = document.createElement('div');
    tabs.className='tags';
    programSections.forEach(sec=>{
      const btn = document.createElement('button');
      btn.className='btn';
      btn.style.padding='8px 10px';
      btn.textContent = sec.title + (sec.isEvent ? ' (이벤트)' : '');
      btn.onclick = ()=>{ activeSectionKey = sec.key; renderLeft(); renderDetail(); };
      if(sec.key===activeSectionKey){ btn.classList.add('primary'); }
      tabs.appendChild(btn);
    });
    left.appendChild(tabs);

    const sec = programSections.find(s=>s.key===activeSectionKey) || programSections[0];
    const list = document.createElement('div');
    list.className='cards';
    list.style.marginTop='12px';

    const filtered = sec.programs.filter(p=>{
      if(!keyword) return true;
      const blob = (p.name+' '+(p.effects||[]).join(' ')+' '+(p.details||'')).toLowerCase();
      return blob.includes(keyword);
    });

    filtered.forEach(p=>{
      const card = document.createElement('div');
      card.className='card';
      card.innerHTML = `
        <div class="cardRow">
          <div class="cardTitle">${escapeHtml(p.name)}</div>
          <div class="price">${fmt(p.price)}원</div>
        </div>
        <div class="tags">${(p.effects||[]).map(e=>`<span class="tag">${escapeHtml(e)}</span>`).join('')}</div>
        <div class="cardRow">
          <div class="muted">Effect 요약</div>
          <div style="display:flex;gap:8px">
            <button class="smallBtn" data-act="detail">상세</button>
            <button class="smallBtn" data-act="add">추가</button>
          </div>
        </div>
      `;
      card.querySelector('[data-act="detail"]').onclick = ()=>{
        selectedItem = { type:'program', section:sec.key, ...p, isEvent: sec.isEvent };
        renderDetail();
      };
      card.querySelector('[data-act="add"]').onclick = ()=>{
        addToCart(p.id, p.name, p.price);
      };
      list.appendChild(card);
    });

    left.appendChild(list);

    // VAT notice (이벤트 제외)
    if(!sec.isEvent){
      const notice = document.createElement('div');
      notice.className='notice';
      notice.innerHTML = `<div class="dot"></div><div><b>${VAT_NOTICE}</b></div>`;
      left.appendChild(notice);
    } else {
      const notice = document.createElement('div');
      notice.className='notice';
      notice.innerHTML = `<div class="dot" style="background:var(--warn)"></div><div><b>이벤트는 VAT 문구 자동 제외</b></div>`;
      left.appendChild(notice);
    }
    return;
  }

  if(view==='single'){
    const cols = [
      ['name','시술명'],
      ['price','1회 비용'],
      ['note','비고'],
      ['act','']
    ];
    const table = document.createElement('table');
    table.className='table';
    table.innerHTML = `
      <thead>
        <tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr>
      </thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');

    const filtered = singleLaserItems.filter(it=>{
      if(!keyword) return true;
      return (it.name+' '+(it.note||'')).toLowerCase().includes(keyword);
    });

    filtered.forEach(it=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${escapeHtml(it.name)}</b></td>
        <td>${fmt(it.price)}원</td>
        <td class="muted">${escapeHtml(it.note||'')}</td>
        <td>
          <button class="smallBtn" data-act="detail">상세</button>
          <button class="smallBtn" data-act="add">추가</button>
        </td>
      `;
      tr.querySelector('[data-act="detail"]').onclick = ()=>{
        selectedItem = { type:'single', ...it };
        renderDetail();
      };
      tr.querySelector('[data-act="add"]').onclick = ()=> addToCart(it.id, it.name, it.price);
      tbody.appendChild(tr);
    });

    left.appendChild(table);

    const notice = document.createElement('div');
    notice.className='notice';
    notice.innerHTML = `<div class="dot"></div><div><b>${VAT_NOTICE}</b></div>`;
    left.appendChild(notice);
    return;
  }
  if(view==='admin'){
    const box = document.createElement('div');
    box.className='kpi';
    box.innerHTML = `
      <div class="muted">관리자(더미)</div>
      <div class="big" style="margin-top:6px">연동 예정 기능</div>
      <ul style="margin:10px 0 0; color:var(--text); line-height:1.7">
        <li>가격표/프로그램 데이터 편집</li>
                <li>VAT 문구 자동 규칙 관리(이벤트 제외)</li>
        <li>프로그램 구성(구성요소) 연결</li>
      </ul>
      <div class="notice"><div class="dot"></div><div><b>${VAT_NOTICE}</b> (이 페이지는 규칙 예시)</div></div>
    `;
    left.appendChild(box);
    return;
  }
}

function renderDetail(){
  const d = qs('#detailBody');
  if(!selectedItem){
    d.innerHTML = `<div class="muted">왼쪽에서 프로그램/단품을 선택하면 상세가 표시됩니다.</div>`;
    return;
  }

  if(selectedItem.type==='program'){
    d.innerHTML = `
      <div class="card" style="background:rgba(15,19,32,.35)">
        <div class="cardRow">
          <div class="cardTitle">${escapeHtml(selectedItem.name)}</div>
          <div class="price">${fmt(selectedItem.price)}원</div>
        </div>
        <div class="muted">Effect</div>
        <div class="tags">${(selectedItem.effects||[]).map(e=>`<span class="tag">${escapeHtml(e)}</span>`).join('')}</div>
        <hr class="sep"/>
        <div class="muted">Program Details</div>
        <div style="line-height:1.7">${escapeHtml(selectedItem.details||'')}</div>
        ${selectedItem.isEvent ? '' : `<div class="notice"><div class="dot"></div><div><b>${VAT_NOTICE}</b></div></div>`}
        <div style="display:flex;gap:10px;margin-top:10px">
          <button class="btn primary" id="detailAdd">장바구니 추가</button>
          <button class="btn" id="detailCopy">상세 복사</button>
        </div>
      </div>
    `;
    qs('#detailAdd').onclick = ()=> addToCart(selectedItem.id, selectedItem.name, selectedItem.price);
    qs('#detailCopy').onclick = ()=>{
      const txt = `[${selectedItem.name}]\n가격: ${fmt(selectedItem.price)}원\nEffect: ${(selectedItem.effects||[]).join(', ')}\n상세: ${selectedItem.details||''}`;
      navigator.clipboard?.writeText(txt).then(()=>toast('상세 복사됨')).catch(()=>toast('복사 실패'));
    };
    return;
  }

  if(selectedItem.type==='single'){
    d.innerHTML = `
      <div class="card" style="background:rgba(15,19,32,.35)">
        <div class="cardRow">
          <div class="cardTitle">${escapeHtml(selectedItem.name)}</div>
          <div class="price">${fmt(selectedItem.price)}원</div>
        </div>
        <div class="muted">비고</div>
        <div style="line-height:1.7">${escapeHtml(selectedItem.note||'')}</div>
        <div class="notice"><div class="dot"></div><div><b>${VAT_NOTICE}</b></div></div>
        <div style="display:flex;gap:10px;margin-top:10px">
          <button class="btn primary" id="detailAdd">장바구니 추가</button>
          <button class="btn" id="detailCopy">상세 복사</button>
        </div>
      </div>
    `;
    qs('#detailAdd').onclick = ()=> addToCart(selectedItem.id, selectedItem.name, selectedItem.price);
    qs('#detailCopy').onclick = ()=>{
      const txt = `[${selectedItem.name}]\n가격: ${fmt(selectedItem.price)}원\n비고: ${selectedItem.note||''}`;
      navigator.clipboard?.writeText(txt).then(()=>toast('상세 복사됨')).catch(()=>toast('복사 실패'));
    };
    return;
  }
}

function renderCart(){
  qs('#cartCount').textContent = cart.reduce((a,c)=>a+(c.qty||0),0);
  const list = qs('#cartList');
  list.innerHTML = '';
  if(cart.length===0){
    list.innerHTML = `<div class="muted" style="padding:10px 0">비어있습니다. 항목을 추가하세요.</div>`;
  } else {
    const table = document.createElement('table');
    table.className='table';
    table.innerHTML = `
      <thead><tr><th>항목</th><th>수량</th><th>금액</th><th></th></tr></thead>
      <tbody></tbody>
    `;
    const tbody = table.querySelector('tbody');
    cart.forEach(item=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${escapeHtml(item.name)}</b></td>
        <td>
          <button class="smallBtn" data-act="dec">-</button>
          <span style="display:inline-block;min-width:26px;text-align:center">${item.qty}</span>
          <button class="smallBtn" data-act="inc">+</button>
        </td>
        <td>${fmt(item.price*item.qty)}원</td>
        <td><button class="smallBtn" data-act="del">삭제</button></td>
      `;
      tr.querySelector('[data-act="dec"]').onclick = ()=> setQty(item.id, item.qty-1);
      tr.querySelector('[data-act="inc"]').onclick = ()=> setQty(item.id, item.qty+1);
      tr.querySelector('[data-act="del"]').onclick = ()=> removeFromCart(item.id);
      tbody.appendChild(tr);
    });
    list.appendChild(table);
  }
  const total = cart.reduce((a,c)=>a+(c.price*c.qty),0);
  qs('#cartTotal').textContent = fmt(total);
  qs('#calcCartSum').textContent = fmt(total);
  updateFinal();
}

/* =========================
   Cart actions
========================= */
function addToCart(id,name,price){
  const found = cart.find(x=>x.id===id);
  if(found) found.qty += 1;
  else cart.push({id,name,price,qty:1});
  toast('장바구니 추가');
  renderCart();
}
function setQty(id,qty){
  const it = cart.find(x=>x.id===id);
  if(!it) return;
  it.qty = Math.max(0, qty|0);
  if(it.qty===0) cart = cart.filter(x=>x.id!==id);
  renderCart();
}
function removeFromCart(id){
  cart = cart.filter(x=>x.id!==id);
  renderCart();
}
function clearCart(){
  cart = [];
  renderCart();
  toast('비움');
}

/* =========================
   Calculator
========================= */
function updateFinal(){
  const total = cart.reduce((a,c)=>a+(c.price*c.qty),0);
  const adj = Number((qs('#adjInput').value||'0').replace(/,/g,'').trim() || 0);
  qs('#finalAmount').textContent = fmt(total + adj);
}

/* =========================
   Drawer / Modal
========================= */
function openCart(){
  qs('#drawerBackdrop').style.display = 'block';
  qs('#cartDrawer').style.display = 'flex';
  qs('#cartDrawer').setAttribute('aria-hidden','false');
}
function closeCart(){
  qs('#drawerBackdrop').style.display = 'none';
  qs('#cartDrawer').style.display = 'none';
  qs('#cartDrawer').setAttribute('aria-hidden','true');
}
function openCalc(){
  qs('#modalBackdrop').style.display = 'grid';
  qs('#adjAmount')?.focus();
  updateFinal();
}
function closeCalc(){
  qs('#modalBackdrop').style.display = 'none';
}

/* =========================
   견적 복사
========================= */
function buildQuoteText(){
  const lines = [];
  lines.push('상담 견적');
  lines.push('----------------');
  cart.forEach(it=>{
    lines.push(`${it.name} x${it.qty} = ${fmt(it.price*it.qty)}원`);
  });
  const total = cart.reduce((a,c)=>a+(c.price*c.qty),0);
  lines.push('----------------');
  lines.push(`합계: ${fmt(total)}원`);
  // VAT notice: 이벤트 제외 규칙은 '가격표 섹션'에만 적용.
  lines.push(VAT_NOTICE);
  return lines.join('\n');
}

/* =========================
   이벤트 바인딩
========================= */
qsa('#nav button').forEach(b=> b.onclick = ()=> setView(b.dataset.view));

qs('#cartBtn').onclick = openCart;
qs('#closeCart').onclick = closeCart;
qs('#drawerBackdrop').onclick = closeCart;

qs('#calcBtn').onclick = openCalc;
qs('#closeCalc').onclick = closeCalc;
qs('#modalBackdrop').onclick = (e)=>{ if(e.target.id==='modalBackdrop') closeCalc(); };

qs('#clearCart').onclick = clearCart;
qs('#copyQuote').onclick = ()=>{
  const txt = buildQuoteText();
  navigator.clipboard?.writeText(txt).then(()=>toast('견적 복사됨')).catch(()=>toast('복사 실패'));
};

qs('#adjInput').addEventListener('input', updateFinal);

/* 계산기 빠른 입력 */
function parseMoney(v){
  return Number(String(v||'').replace(/,/g,'').trim() || 0);
}
function setAdj(val){
  const n = Math.trunc(Number(val||0));
  qs('#adjInput').value = String(n);
  updateFinal();
}
function cartSum(){
  return cart.reduce((a,c)=>a+(c.price*c.qty),0);
}
qs('#adjPlusBtn').onclick = ()=>{
  const amt = Math.abs(parseMoney(qs('#adjAmount').value));
  if(!amt) return;
  setAdj(amt);
};
qs('#adjMinusBtn').onclick = ()=>{
  const amt = Math.abs(parseMoney(qs('#adjAmount').value));
  if(!amt) return;
  setAdj(-amt);
};
qs('#disc10').onclick = ()=>{
  const total = cartSum();
  setAdj(-Math.round(total * 0.10));
};
qs('#disc15').onclick = ()=>{
  const total = cartSum();
  setAdj(-Math.round(total * 0.15));
};
qs('#disc20').onclick = ()=>{
  const total = cartSum();
  setAdj(-Math.round(total * 0.20));
};

qs('#searchInput').addEventListener('input', ()=>{ renderLeft(); });

/* 단축키 */
document.addEventListener('keydown', (e)=>{
  if(e.key==='/'){
    e.preventDefault();
    qs('#searchInput').focus();
  }
  if(e.key==='k' || e.key==='K'){
    openCart();
  }
  if(e.key==='c' || e.key==='C'){
    openCalc();
  }
  if(e.key==='Escape'){
    closeCalc();
    closeCart();
  }
});

/* XSS minimal */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, (m)=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

/* 초기 렌더 */
renderAll();
</script>
