<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>내 사이트</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;margin:0;padding:24px;background:#fff;color:#111}
    .wrap{max-width:980px;margin:0 auto}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    nav a{display:inline-block;margin:6px 8px 0 0;padding:10px 12px;border:1px solid #e5e7eb;border-radius:12px;text-decoration:none;color:#111}
    .hero{margin-top:16px;border:1px solid #e5e7eb;border-radius:16px;padding:18px}
    h1{margin:0 0 6px;font-size:22px}
    p{margin:0;color:#374151;line-height:1.6}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
    .card{border:1px solid #e5e7eb;border-radius:16px;padding:16px}
    .btn{display:inline-block;margin-top:10px;padding:12px 14px;border:1px solid #111;border-radius:14px;text-decoration:none;color:#111}
    .muted{margin-top:10px;color:#6b7280;font-size:13px;line-height:1.5}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <strong>내 사이트</strong>
      <nav>
        <a href="./index.html">홈</a>
        <a href="./site/price.html">가격안내</a>
        <a href="./site/about.html">소개</a>
        <a href="./site/contact.html">문의</a>
      </nav>
    </header>

    <div class="hero">
      <h1>홈</h1>
      <p>메뉴를 선택하세요.</p>

      <div class="grid">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:18px;">재고관리 앱 (PWA)</h2>
          <p style="margin:0;color:#374151;line-height:1.6;">품목/입고/사용/조정 이벤트 기록, 현재 재고 자동 계산.</p>
          <a class="btn" href="./apps/inventory/index.html">재고관리 열기</a>
          <div class="muted">iOS Safari에서 접속 후 공유 → “홈 화면에 추가”</div>
        </div>

        <div class="card">
          <h2 style="margin:0 0 6px;font-size:18px;">상담·가격표 앱</h2>
          <p style="margin:0;color:#374151;line-height:1.6;">카테고리/항목 편집, 카트 합계 계산, 저장.</p>
          <a class="btn" href="./apps/consult/index.html">상담가격표 열기</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
