<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>클리닉 통합 가격표 · 재고 · 관리자</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <meta name="theme-color" content="#111827" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-title" id="brandTitle">다채움의원</div>
        <div class="brand-sub" id="brandSub">Consult · Price · Inventory</div>
      </div>

      <nav class="nav">
        <div class="nav-group">
          <div class="nav-group-title">가격표</div>
          <a class="nav-item" href="#/price/programs" data-route="/price/programs">프로그램</a>
          <a class="nav-item" href="#/price/events" data-route="/price/events">이벤트</a>
          <a class="nav-item" href="#/single" data-route="/single">단품 레이저(표)</a>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">도구</div>
          <a class="nav-item" href="#/search" data-route="/search">검색</a>
          <a class="nav-item" href="#/calculator" data-route="/calculator">계산기</a>
          <a class="nav-item" href="#/cart" data-route="/cart">장바구니</a>
        </div>

        <div class="nav-group">
          <div class="nav-group-title">관리</div>
          <a class="nav-item" href="#/inventory" data-route="/inventory">재고</a>
          <a class="nav-item" href="#/admin" data-route="/admin">관리자 페이지</a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost" id="exportBtn">데이터 내보내기</button>
        <label class="btn btn-ghost file">
          데이터 가져오기
          <input type="file" id="importInput" accept="application/json" />
        </label>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="메뉴">
          <span class="icon">☰</span>
        </button>
        <div class="topbar-title" id="pageTitle">가격표</div>
        <div class="topbar-actions">
          <a class="pill" href="#/cart" id="cartPill">장바구니 0</a>
        </div>
      </header>

      <section class="content" id="content"></section>

      <footer class="vat" id="vatNotice" aria-live="polite"></footer>
    </main>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  </script>
</body>
</html>
