<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>상담 가격표</title>
<link href="./styles.css" rel="stylesheet"/>
</head>
<body>
<div class="app">
<!-- Sidebar -->
<aside class="sidebar">
<div class="topbar">
<div class="title grow">
<h1 id="clinicNameText">다채움의원</h1>
<p>Premium Consultation</p>
</div>
<button class="iconbtn" id="editClinicBtn" title="병원명 수정">
<svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
</svg>
</button>
</div>
<div class="section">
<div class="row" style="justify-content:space-between">
<div class="toggle">
<div aria-checked="false" class="switch" id="editSwitch" role="switch"></div>
<div>
<div style="font-weight:950;font-size:13px">편집 모드</div>
<div class="hint tiny">카테고리/항목 추가·수정·삭제</div>
</div>
</div>
<button class="btn small" id="addCatBtn">카테고리 추가</button>
</div>
</div>
<div class="list" id="catList"></div>
</aside>
<!-- Main -->
<main class="main">
<div class="topbar">
<div class="title grow">
<h1 id="activeCatTitle">카테고리를 선택하세요</h1>
<p>시술을 선택해 카트에 담고 할인 계산을 적용하세요.</p>
</div>
<div class="row">
<button class="btn" id="addItemBtn">시술 추가</button>

        <button class="btn" onclick="location.href='../../site/price.html'">가격안내</button>
        <button class="btn" onclick="location.href='../inventory/index.html'">재고관리</button></div>
</div>
<div class="content">
<div class="grid" id="itemGrid"></div>
<div class="item empty" id="emptyState">
        왼쪽에서 카테고리를 선택하세요.
      </div>
</div>
</main>
<!-- Cart -->
<aside class="cart">
<div class="topbar">
<div class="title grow">
<h1>상담</h1>
<p>카트/할인 계산 + 상담내역 저장</p>
</div>
<button class="btn small" id="clearCartBtn">카트 초기화</button>
</div>
<div class="tabs">
<button class="tab active" id="tabCart">카트</button>
<button class="tab" id="tabHistory">기록</button>
</div>
<!-- CART VIEW -->
<div class="cart-body" id="viewCart">
<div class="stack" id="cartList"></div>
<div class="sum">
<span>총합</span>
<b id="totalSumText">₩ 0</b>
</div>
<div class="panel">
<h3>할인율 적용</h3>
<div class="rate-grid">
<button class="chipbtn" data-rate="10">10%</button>
<button class="chipbtn" data-rate="15">15%</button>
<button class="chipbtn" data-rate="20">20%</button>
<button class="chipbtn" id="customRateBtn">직접(%)</button>
</div>
<div class="row hide" id="customRateRow" style="margin-top:10px">
<input class="field right" id="customRateInput" max="100" min="0" placeholder="할인율 입력" step="0.1" type="number"/>
<div style="font-weight:950">%</div>
</div>
<button class="btn ghost small" id="customPriceBtn" style="width:100%; margin-top:10px; text-decoration:underline; text-underline-offset:4px;">
          최종 확정가 직접 입력 (할인율 역산)
        </button>
<div class="row hide" id="customPriceRow" style="margin-top:10px">
<div style="font-weight:950">₩</div>
<input class="field right mono" id="customPriceInput" min="0" placeholder="최종 금액 입력" step="1" type="number"/>
</div>
</div>
<div class="summary">
<div class="row between">
<span class="hint">할인 금액</span>
<span class="danger-text" id="discountAmountText">- ₩ 0</span>
</div>
<div class="row between">
<span class="hint">실제 적용 할인율</span>
<span class="pill" id="actualRateText">0.0%</span>
</div>
</div>
<div class="final">
<span>최종 제안가</span>
<b id="finalPriceText">₩ 0</b>
</div>
<button class="btn primary" id="confirmBtn" style="width:100%; margin-top:14px; padding:14px 12px; border-radius:16px; font-size:16px">
        상담 확정 + 저장
      </button>
<div class="hint tiny" style="margin-top:8px">
        상담 기록은 이 기기(localStorage)에 자동 저장됩니다.
      </div>
</div>
<!-- HISTORY VIEW -->
<div class="cart-body hide" id="viewHistory">
<div class="panel" style="margin-bottom:12px">
<h3>기록 관리</h3>
<div class="row">
<button class="btn small" id="exportBtn">텍스트로 내보내기</button>
<button class="btn small danger" id="wipeHistoryBtn" style="margin-left:auto;">기록 전체 삭제</button>
</div>
<div class="hint tiny" style="margin-top:8px">
          내보내기는 "복사할 텍스트"를 보여줍니다(메일/메모 앱에 붙여넣기).
        </div>
</div>
<div class="stack" id="historyList"></div>
<div class="item empty" id="historyEmpty">
        저장된 상담 기록이 없습니다.
      </div>
</div>
</aside>
</div>
<script src="./app.js"></script>
</body>
</html>
