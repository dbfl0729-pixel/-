<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>관리자</title>
  <link rel="stylesheet" href="../../shared/ui.css" />
  <style>
    .inp{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
    .btn{padding:12px 14px;border:1px solid #111;border-radius:14px;background:#fff;cursor:pointer}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .note{color:var(--muted);font-size:13px;line-height:1.6}
    textarea{min-height:160px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
  </style>
</head>
<body data-vat="off">
  <div class="topbar">
    <button class="iconbtn" data-ui="menu" aria-label="메뉴">☰</button>
    <strong>관리자</strong>
  </div>
  <div class="overlay"></div>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">D</div>
        <div>
          <div class="name">다채움</div>
          <div style="color:var(--muted);font-size:12px;">통합 운영</div>
        </div>
      </div>
      <div class="nav">
        <a href="../../index.html"><span>홈</span><small></small></a>
        <a href="../../site/price.html"><span>가격안내</span><small>프로그램/단품</small></a>
        <a href="../consult/index.html"><span>상담·계산</span><small>검색/카트</small></a>
        <a href="../inventory/index.html"><span>재고관리</span><small>PWA</small></a>
        <a href="./index.html" style="border-color:#111827"><span>관리자</span><small>백업/복원</small></a>
        <a href="../../site/about.html"><span>소개</span><small></small></a>
        <a href="../../site/contact.html"><span>문의</span><small></small></a>
      </div>
    </aside>

    <main class="main">
      <h1 class="h1">백업 / 복원</h1>
      <p class="p">브라우저 저장 데이터를 JSON으로 내보내거나 복원합니다.</p>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:900;margin-bottom:8px">대상 키</div>
        <div class="note">
          상담앱: <b>consult_price_app_v1</b><br/>
          재고앱: <b>consult_app_v2</b>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:900;margin-bottom:8px">내보내기</div>
        <div class="row">
          <button class="btn" id="exportBtn">JSON 생성</button>
          <button class="btn" id="downloadBtn" disabled>다운로드</button>
        </div>
        <div style="margin-top:10px">
          <textarea class="inp" id="jsonArea" placeholder="여기에 JSON이 표시됩니다."></textarea>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:900;margin-bottom:8px">복원</div>
        <div class="note">아래 JSON을 붙여넣고 “복원”을 누르세요.</div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="importBtn">복원</button>
          <button class="btn" id="resetBtn">초기화</button>
        </div>
      </div>

      <div class="card" style="margin-top:12px">
        <div style="font-weight:900;margin-bottom:8px">주의</div>
        <div class="note">
          • 복원은 현재 브라우저 데이터에 즉시 적용됩니다.<br/>
          • 실운영 전, 먼저 내보내기 후 복원 테스트를 권장합니다.
        </div>
      </div>

    </main>
  </div>

  <script src="../../shared/ui.js"></script>
  <script>
    const KEYS = ["consult_price_app_v1", "consult_app_v2"];
    const area = document.getElementById("jsonArea");
    const exportBtn = document.getElementById("exportBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const importBtn = document.getElementById("importBtn");
    const resetBtn = document.getElementById("resetBtn");

    function buildBackup(){
      const out = { version: 1, createdAt: new Date().toISOString(), data: {} };
      KEYS.forEach(k => { out.data[k] = localStorage.getItem(k) || null; });
      return out;
    }

    exportBtn.addEventListener("click", () => {
      const obj = buildBackup();
      area.value = JSON.stringify(obj, null, 2);
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener("click", () => {
      try{
        const blob = new Blob([area.value || ""], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "dacheum_backup.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }catch(e){ alert("다운로드 실패"); }
    });

    importBtn.addEventListener("click", () => {
      try{
        const obj = JSON.parse(area.value || "");
        if(!obj || !obj.data) return alert("형식 오류");
        KEYS.forEach(k => {
          if(obj.data.hasOwnProperty(k)){
            const v = obj.data[k];
            if(v === null) localStorage.removeItem(k);
            else localStorage.setItem(k, v);
          }
        });
        alert("복원 완료");
      }catch(e){ alert("복원 실패: JSON 형식 확인"); }
    });

    resetBtn.addEventListener("click", () => {
      if(!confirm("상담/재고 저장 데이터를 초기화합니다. 계속?")) return;
      KEYS.forEach(k => localStorage.removeItem(k));
      alert("초기화 완료");
    });
  </script>
</body>
</html>
